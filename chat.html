<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdsOS · Canal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0d0b1e;color:#fff;font-size:14px;color-scheme:dark}
:root{
  --bg:#0d0b1e;--sb:#0f0d24;--panel:#14122a;--card:#1c192f;--card2:#221f3a;--inp:#181630;
  --accent:#7c5cfc;--acc-h:#6a4def;--acc-d:rgba(124,92,252,.18);
  --border:#2a2748;--b2:#1e1c35;--text:#ffffff;--muted:#8a84b8;--muted2:#5e5a8a;
  --todo:#5b8af5;--todo-bg:rgba(91,138,245,.12);
  --proc:#a56bff;--proc-bg:rgba(165,107,255,.12);
  --rev:#ffab40;--rev-bg:rgba(255,171,64,.1);
  --falta:#ff5757;--falta-bg:rgba(255,87,87,.1);
  --fin:#4caf7d;--fin-bg:rgba(76,175,125,.1);--urg:#ff5757;
}
.hidden{display:none!important}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.2);opacity:0}}

/* ── Layout ── */
#root{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:230px;min-width:230px;background:var(--sb);border-right:1px solid var(--b2);display:flex;flex-direction:column;overflow:hidden}
.sb-top{padding:14px 14px 10px;border-bottom:1px solid var(--b2)}
.sb-logo{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sb-mark{width:26px;height:26px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.sb-txt{font-size:14px;font-weight:700;color:#fff}
.sb-srch{position:relative}
.sb-srch input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px 7px 28px;color:#fff;font-size:12px;outline:none;transition:border-color .15s}
.sb-srch input:focus{border-color:var(--accent)}
.sb-srch input::placeholder{color:var(--muted2)}
.sb-si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:12px;pointer-events:none}
.sb-body{flex:1;overflow-y:auto;padding:6px 0 10px}
.sb-body::-webkit-scrollbar{width:3px}
.sb-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sector-lbl{padding:10px 14px 3px;font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.2px}
.ch-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;transition:background .12s;margin:1px 6px;border-radius:8px}
.ch-item:hover{background:var(--card)}
.ch-item.active{background:var(--acc-d)}
.ch-item.active .ch-name{color:#fff;font-weight:600}
.ch-av{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:13px;color:#e2ddf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ch-prev{font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ch-bdg{background:var(--accent);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;flex-shrink:0}
.sb-foot{padding:10px 12px;border-top:1px solid var(--b2);display:flex;align-items:center;gap:8px}
.me-av{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.me-name{font-size:12px;color:#fff;font-weight:600;flex:1}
.me-dot{width:7px;height:7px;border-radius:50%;background:#4caf7d}

/* ── Chat ── */
.chat{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.no-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.no-chat .ic{font-size:48px;opacity:.2}
.no-chat p{font-size:13px;color:var(--muted);text-align:center;line-height:1.7}

/* header */
.chat-hdr{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--b2);display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:52px}
.hdr-av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.hdr-inf{flex:1;min-width:0}
.hdr-name{font-weight:700;font-size:15px;color:#fff}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:1px}
.hdr-acts{display:flex;align-items:center;gap:8px;flex-shrink:0}
.notif-wrap{position:relative}
.notif-bell{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:5px 7px;border-radius:7px;line-height:1;transition:all .15s}
.notif-bell:hover{color:#fff;background:var(--card)}
.notif-bdg{position:absolute;top:0;right:0;background:var(--urg);color:#fff;border-radius:10px;font-size:9px;font-weight:800;padding:1px 4px;min-width:16px;text-align:center;pointer-events:none;line-height:1.4}
.notif-panel{position:absolute;top:calc(100% + 6px);right:0;width:300px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:400;overflow:hidden}
.notif-head{padding:12px 14px 8px;border-bottom:1px solid var(--b2);display:flex;align-items:center;justify-content:space-between}
.notif-htitle{font-size:12px;font-weight:700;color:#fff}
.notif-clear{font-size:11px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit}
.notif-list{max-height:300px;overflow-y:auto}
.notif-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--b2);cursor:pointer;transition:background .12s}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--card)}
.notif-item.unread{background:rgba(124,92,252,.06)}
.notif-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--card2)}
.notif-body{flex:1;min-width:0}
.notif-txt{font-size:12px;color:#e2ddf5;line-height:1.4}
.notif-ts{font-size:10px;color:var(--muted2);margin-top:2px}
.notif-empty{padding:28px;text-align:center;font-size:12px;color:var(--muted2)}
.btn-reg{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit}
.btn-reg:hover{opacity:.85}

/* feed */
.feed{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.feed::-webkit-scrollbar{width:4px}
.feed::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.date-div{text-align:center;margin:4px 0}
.date-div span{font-size:10px;color:var(--muted2);background:var(--panel);border:1px solid var(--b2);border-radius:20px;padding:3px 12px}

/* messages */
.msg{display:flex;gap:7px;max-width:72%;align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px}
.msg-cnt{display:flex;flex-direction:column}
.msg.me .msg-cnt{align-items:flex-end}
.msg-from{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;padding:0 3px}
.msg-body{background:var(--card);border-radius:4px 12px 12px 12px;padding:8px 12px;font-size:13px;color:#e2ddf5;line-height:1.5;word-break:break-word}
.msg.me .msg-body{background:rgba(124,92,252,.22);border-radius:12px 4px 12px 12px;border:1px solid rgba(124,92,252,.25);color:#fff}
.msg-ts{font-size:10px;color:var(--muted2);margin-top:3px;padding:0 3px}

/* activity cards */
.act-wrap{align-self:flex-start;max-width:540px;width:100%}
.act-card{background:var(--card);border:1px solid var(--b2);border-radius:12px;padding:13px 15px;transition:border-color .15s}
.act-card:hover{border-color:var(--border)}
.act-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.act-qttyp{font-size:13px;font-weight:700;color:#fff}
.act-urg{background:rgba(255,87,87,.12);color:var(--urg);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid rgba(255,87,87,.3)}
.act-st{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.3px}
.act-st.todo{background:var(--todo-bg);color:var(--todo);border:1px solid rgba(91,138,245,.3)}
.act-st.proc{background:var(--proc-bg);color:var(--proc);border:1px solid rgba(165,107,255,.3)}
.act-st.review{background:var(--rev-bg);color:var(--rev);border:1px solid rgba(255,171,64,.3)}
.act-st.falta{background:var(--falta-bg);color:var(--falta);border:1px solid rgba(255,87,87,.3)}
.act-st.fin{background:var(--fin-bg);color:var(--fin);border:1px solid rgba(76,175,125,.3)}
.act-ctx{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.45}
.act-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.act-mi{font-size:11px;color:var(--muted2)}
.act-mi strong{color:#e2ddf5;font-weight:600}
.act-divider{border:none;border-top:1px solid var(--b2);margin:8px 0}
.act-cmt{display:flex;gap:6px;align-items:flex-start;margin-bottom:10px}
.act-cmt-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
.act-cmt-txt{font-size:11px;color:var(--muted);line-height:1.45}
.act-cmt-from{font-weight:700;color:var(--muted)}
.act-btns{display:flex;gap:6px;flex-wrap:wrap}
.act-btn{font-size:11px;font-weight:700;padding:5px 11px;border-radius:6px;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.act-btn.deliver{background:var(--accent);color:#fff}
.act-btn.deliver:hover{background:var(--acc-h)}
.act-btn.approve{background:var(--fin-bg);color:var(--fin);border:1px solid rgba(76,175,125,.3)}
.act-btn.approve:hover{background:rgba(76,175,125,.2)}
.act-btn.nota{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.act-btn.nota:hover{color:#fff}
.act-btn.reopen{background:var(--card2);color:var(--muted2);border:1px solid var(--b2)}
.act-btn.reopen:hover{color:var(--muted)}
.act-card-ts{font-size:10px;color:var(--muted2);text-align:right;margin-top:5px}

/* compose */
.compose{padding:10px 16px 14px;background:var(--panel);border-top:1px solid var(--b2);flex-shrink:0}
.compose-hints{display:flex;gap:2px;margin-bottom:6px}
.c-hint{background:none;border:none;color:var(--muted2);cursor:pointer;padding:3px 5px;border-radius:5px;font-size:15px;transition:all .15s}
.c-hint:hover{color:#fff;background:var(--card)}
.c-hint.active{color:var(--urg);animation:pulse 1s infinite}
.compose-row{display:flex;align-items:flex-end;gap:7px}
.compose-ta{flex:1;background:var(--inp);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:#fff;font-size:13px;resize:none;min-height:40px;max-height:120px;outline:none;font-family:inherit;line-height:1.45;transition:border-color .15s}
.compose-ta:focus{border-color:var(--accent)}
.compose-ta::placeholder{color:var(--muted2)}
.compose-send{background:var(--accent);border:none;color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.compose-send:hover{background:var(--acc-h);transform:scale(1.05)}

/* ══════════════════════════════════
   WIZARD — registro paso a paso
   ══════════════════════════════════ */
.wizard{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

.wz-topbar{padding:14px 24px 0;flex-shrink:0}
.wz-prog-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:12px}
.wz-prog{height:3px;background:var(--accent);border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.wz-toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.wz-step-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.wz-cancel{background:none;border:none;color:var(--muted2);font-size:12px;cursor:pointer;font-family:inherit;transition:color .15s}
.wz-cancel:hover{color:#fff}

.wz-scroll{flex:1;overflow-y:auto;padding:24px 24px 16px}
.wz-scroll::-webkit-scrollbar{width:3px}
.wz-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.wz-inner{max-width:720px;margin:0 auto}

/* question typography */
.wz-q{font-size:28px;font-weight:800;color:#fff;line-height:1.15;margin-bottom:6px;letter-spacing:-.3px}
.wz-q2{font-size:18px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:4px;margin-top:28px}
.wz-hint{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.5}
.wz-hint2{font-size:13px;color:var(--muted);margin-bottom:14px;margin-top:-6px}

/* category filter tabs */
.wz-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.wz-cat{background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600;padding:5px 13px;border-radius:20px;cursor:pointer;transition:all .15s;font-family:inherit}
.wz-cat:hover{color:#fff}
.wz-cat.sel{background:var(--acc-d);border-color:var(--accent);color:#fff}

/* tipo icon grid */
.wz-tipo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wz-tipo-btn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 10px;background:var(--card);border:2px solid transparent;border-radius:14px;cursor:pointer;transition:all .15s;font-family:inherit}
.wz-tipo-btn:hover{border-color:var(--border);background:var(--card2)}
.wz-tipo-btn.sel{border-color:var(--accent);background:var(--acc-d)}
.wz-tipo-ic{font-size:26px;line-height:1}
.wz-tipo-lbl{font-size:11px;color:var(--muted);font-weight:600;text-align:center;line-height:1.35}
.wz-tipo-btn.sel .wz-tipo-lbl{color:#fff}
.wz-selected-tipo{margin-top:16px;padding:13px 18px;background:var(--acc-d);border:1px solid var(--accent);border-radius:10px;font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.wz-selected-tipo .check{color:#a78bfa;font-size:18px}

/* qty counter */
.wz-qty-center{display:flex;flex-direction:column;align-items:center;gap:20px;padding:28px 0}
.wz-qty-row{display:flex;align-items:center;gap:18px}
.wz-qbtn{width:52px;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;line-height:1}
.wz-qbtn:hover{background:var(--card2);border-color:var(--accent)}
.wz-qnum{font-size:64px;font-weight:800;color:#fff;min-width:90px;text-align:center;line-height:1}
.wz-qsub{font-size:15px;color:var(--muted);text-align:center;line-height:1.4}

/* text inputs + voice */
.wz-inp-wrap{position:relative;margin-bottom:8px}
.wz-inp{width:100%;background:var(--inp);border:1px solid var(--border);border-radius:10px;padding:13px 48px 13px 16px;color:#fff;font-size:15px;outline:none;font-family:inherit;transition:border-color .15s;color-scheme:dark}
.wz-inp:focus{border-color:var(--accent)}
.wz-inp::placeholder{color:var(--muted2)}
.wz-ta{width:100%;background:var(--inp);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:#fff;font-size:14px;outline:none;font-family:inherit;line-height:1.5;min-height:100px;resize:vertical;transition:border-color .15s;color-scheme:dark}
.wz-ta:focus{border-color:var(--accent)}
.wz-ta::placeholder{color:var(--muted2)}
.wz-mic-inline{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted2);font-size:18px;cursor:pointer;padding:4px;border-radius:6px;line-height:1;transition:all .15s}
.wz-mic-inline:hover{color:#fff}
.wz-mic-inline.active{color:var(--urg);animation:pulse 1s infinite}

/* big voice button */
.wz-voice-area{display:flex;flex-direction:column;align-items:center;gap:10px;margin:20px 0 10px}
.wz-big-mic{width:70px;height:70px;border-radius:50%;background:var(--card);border:2px solid var(--border);color:var(--muted);font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative;flex-shrink:0}
.wz-big-mic::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0;transition:opacity .2s}
.wz-big-mic:hover{border-color:var(--accent);color:#fff;background:var(--acc-d)}
.wz-big-mic.active{background:rgba(255,87,87,.12);border-color:var(--urg);color:var(--urg)}
.wz-big-mic.active::before{opacity:.4;animation:pulse 1.2s infinite}
.wz-voice-lbl{font-size:12px;color:var(--muted2);text-align:center}
.wz-voice-lbl.on{color:var(--urg);font-weight:600}

/* team picker */
.wz-team-grid{display:flex;gap:10px;flex-wrap:wrap}
.wz-team-btn{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:12px 14px;border-radius:14px;transition:all .15s;border:2px solid transparent;background:var(--card);min-width:74px;font-family:inherit}
.wz-team-btn:hover{background:var(--card2);border-color:var(--border)}
.wz-team-btn.sel{background:var(--acc-d);border-color:var(--accent)}
.wz-team-av{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.wz-team-nm{font-size:11px;color:var(--muted);font-weight:600}
.wz-team-btn.sel .wz-team-nm{color:#fff}
.wz-team-sm .wz-team-av{width:38px;height:38px;font-size:13px;border-radius:10px}
.wz-team-sm .wz-team-nm{font-size:10px}

/* date shortcuts */
.wz-date-scs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.wz-dsc{background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .15s;font-family:inherit}
.wz-dsc:hover{color:#fff}
.wz-dsc.sel{background:var(--acc-d);border-color:var(--accent);color:#fff}
.wz-date-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wz-flbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.wz-inp-d{width:100%;background:var(--inp);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;color-scheme:dark}
.wz-inp-d:focus{border-color:var(--accent)}

/* summary card */
.wz-summary{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:18px}
.wz-sum-row{display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--b2);align-items:flex-start}
.wz-sum-row:last-child{border-bottom:none}
.wz-sum-lbl{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.6px;min-width:78px;flex-shrink:0;padding-top:2px}
.wz-sum-val{font-size:13px;color:#fff;flex:1;line-height:1.45;word-break:break-word}

/* urgente toggle in wizard */
.wz-urg{display:flex;align-items:center;gap:14px;cursor:pointer;padding:14px 16px;background:var(--inp);border:1px solid var(--border);border-radius:12px;transition:all .15s;user-select:none}
.wz-urg.on{background:rgba(255,87,87,.08);border-color:rgba(255,87,87,.35)}
.wz-urg-ic{font-size:22px;flex-shrink:0}
.wz-urg-inf{flex:1}
.wz-urg-t{font-size:14px;font-weight:700;color:#fff}
.wz-urg-d{font-size:12px;color:var(--muted2);margin-top:2px}
.wz-urg-sw{width:40px;height:22px;border-radius:11px;background:var(--border);position:relative;flex-shrink:0;transition:background .2s}
.wz-urg-sw::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.wz-urg.on .wz-urg-sw{background:var(--urg)}
.wz-urg.on .wz-urg-sw::after{transform:translateX(18px)}

/* nav bar */
.wz-nav{padding:14px 24px 18px;background:var(--panel);border-top:1px solid var(--b2);display:flex;align-items:center;gap:12px;flex-shrink:0}
.wz-back{background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:11px 20px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.wz-back:hover{color:#fff}
.wz-next{background:var(--accent);border:none;color:#fff;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;flex:1;max-width:320px;transition:opacity .15s}
.wz-next:hover{opacity:.85}

/* ── Note modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--b2);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:14px;font-weight:700;color:#fff}
.modal-x{background:none;border:none;color:var(--muted2);font-size:18px;cursor:pointer;padding:2px 7px;border-radius:6px;line-height:1;transition:all .15s;font-family:inherit}
.modal-x:hover{color:#fff;background:var(--card)}
.modal-body{padding:16px 18px}
.modal-foot{padding:10px 18px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--b2)}
.note-ta{width:100%;background:var(--inp);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:#fff;font-size:13px;resize:none;min-height:80px;outline:none;font-family:inherit;line-height:1.45;transition:border-color .15s;color-scheme:dark}
.note-ta:focus{border-color:var(--accent)}
.note-ta::placeholder{color:var(--muted2)}
.f-lbl{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.btn-sub2{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-sub2:hover{opacity:.85}
.btn-can2{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-can2:hover{color:#fff}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(0);background:#0d2a1a;border:1px solid rgba(76,175,125,.4);color:#4caf7d;border-radius:9px;padding:9px 18px;font-size:13px;font-weight:600;z-index:999;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.hidden{opacity:0;transform:translateX(-50%) translateY(8px)}
</style>
</head>
<body>
<div id="root">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sb-top">
      <div class="sb-logo"><div class="sb-mark">A</div><span class="sb-txt">AdsOS</span></div>
      <div class="sb-srch">
        <span class="sb-si">⌕</span>
        <input id="sb-q" type="text" placeholder="Buscar cliente…" autocomplete="off" oninput="renderSidebar()">
      </div>
    </div>
    <div class="sb-body" id="sb-body"></div>
    <div class="sb-foot">
      <div class="me-av">F</div><span class="me-name">Fryda</span><div class="me-dot"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat" id="chat">
    <div class="no-chat" id="no-chat">
      <div class="ic">💬</div>
      <p>Selecciona un cliente<br>para ver su canal de actividades</p>
    </div>

    <div class="hidden" id="chat-view" style="display:flex;flex-direction:column;flex:1;overflow:hidden">

      <!-- Header -->
      <div class="chat-hdr">
        <div class="hdr-av" id="hdr-av"></div>
        <div class="hdr-inf">
          <div class="hdr-name" id="hdr-name"></div>
          <div class="hdr-sub" id="hdr-sub"></div>
        </div>
        <div class="hdr-acts">
          <div class="notif-wrap" id="notif-wrap">
            <button class="notif-bell" onclick="toggleNotifPanel()" title="Notificaciones">🔔</button>
            <span class="notif-bdg hidden" id="notif-bdg">0</span>
            <div class="notif-panel hidden" id="notif-panel">
              <div class="notif-head">
                <span class="notif-htitle">Notificaciones</span>
                <button class="notif-clear" onclick="clearNotifs()">Limpiar</button>
              </div>
              <div class="notif-list" id="notif-list"></div>
            </div>
          </div>
          <button class="btn-reg" onclick="openWizard()">+ Registrar actividad</button>
        </div>
      </div>

      <!-- Feed (default view) -->
      <div class="feed" id="feed"></div>
      <div class="compose" id="compose-bar">
        <div class="compose-hints">
          <button class="c-hint" onclick="ins('😊')">😊</button>
          <button class="c-hint" onclick="ins('@')">@</button>
          <button class="c-hint" onclick="ins('✓')">✓</button>
          <button class="c-hint" onclick="ins('🔥')">🔥</button>
          <button class="c-hint" id="compose-mic" title="Dictar mensaje" onclick="startSR('compose')">🎙</button>
        </div>
        <div class="compose-row">
          <textarea id="compose" class="compose-ta" placeholder="Escribe un mensaje…" rows="1"
            onkeydown="onCompKey(event)" oninput="autoRz(this)"></textarea>
          <button class="compose-send" onclick="sendMsg()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Wizard (replaces feed+compose when registering) -->
      <div class="wizard hidden" id="wizard">
        <div class="wz-topbar">
          <div class="wz-prog-wrap"><div class="wz-prog" id="wz-prog" style="width:14%"></div></div>
          <div class="wz-toprow">
            <span class="wz-step-lbl" id="wz-step-lbl">PASO 1 DE 7</span>
            <button class="wz-cancel" onclick="closeWizard()">✕ Cancelar</button>
          </div>
        </div>
        <div class="wz-scroll" id="wz-scroll">
          <div class="wz-inner" id="wz-content"></div>
        </div>
        <div class="wz-nav">
          <button class="wz-back" id="wz-back" onclick="wBack()">← Atrás</button>
          <button class="wz-next" id="wz-next" onclick="wNext()">Continuar →</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Note modal -->
<div class="modal-bg hidden" id="note-modal">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Agregar nota</span>
      <button class="modal-x" onclick="closeNote()">✕</button>
    </div>
    <div class="modal-body">
      <label class="f-lbl">Nota o comentario</label>
      <textarea id="note-ta" class="note-ta" placeholder="Actualización, bloqueo, avance…"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn-can2" onclick="closeNote()">Cancelar</button>
      <button class="btn-sub2" onclick="submitNote()">Agregar</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
// ─── Helpers ─────────────────────────────────────
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const el=id=>document.getElementById(id);
const hoy=()=>new Date().toISOString().slice(0,10);

function fmtTs(iso){
  const d=new Date(iso),n=new Date();
  if(n.toDateString()===d.toDateString())return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const yd=new Date(n);yd.setDate(n.getDate()-1);
  if(yd.toDateString()===d.toDateString())return'Ayer';
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
}
function fmtDateFeed(iso){
  const d=new Date(iso),n=new Date();
  if(n.toDateString()===d.toDateString())return'Hoy';
  const yd=new Date(n);yd.setDate(n.getDate()-1);
  if(yd.toDateString()===d.toDateString())return'Ayer';
  return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
}
function fmtEntrega(fecha,hora){
  if(!fecha)return'—';
  const d=new Date(fecha+'T12:00:00');
  const f=d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
  if(!hora)return f;
  const[h,m]=hora.split(':');const t=new Date();t.setHours(+h,+m,0,0);
  return f+' · '+t.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
function initials(n){
  if(!n)return'?';const p=n.trim().split(' ');
  return(p.length>1?p[0][0]+p[1][0]:p[0].slice(0,2)).toUpperCase();
}
function showToast(msg,type='ok'){
  const t=el('toast');t.textContent=msg;
  const map={ok:['#0d2a1a','rgba(76,175,125,.4)','#4caf7d'],err:['#2a1018','rgba(255,87,87,.4)','#ff8aab'],info:['#12102a','rgba(124,92,252,.4)','#a78bfa']};
  const[bg,bc,c]=map[type]||map.ok;
  t.style.background=bg;t.style.borderColor=bc;t.style.color=c;
  t.classList.remove('hidden');clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.add('hidden'),2800);
}
function persist(){localStorage.setItem('adsos-v4',JSON.stringify({clients,activities,messages}));}

// ─── Constants ────────────────────────────────────
const TIPOS={
  'Redes sociales':['Arte en movimiento','Arte estático','Historia / Story','Reel','Carrusel','Parrilla del mes','Parrilla semanal','Copy / Texto'],
  'Producción':['Video','Guion','Fotografía'],
  'Digital':['Sitio web','Newsletter','Pauta / Ads','Campaña'],
  'Estrategia':['Investigación de mercado','Investigación','Estrategia','Propuesta','Presentación','Reporte']
};
const TIPO_IC={
  'Arte en movimiento':'🎬','Arte estático':'🎨','Historia / Story':'📱','Reel':'🎥',
  'Carrusel':'🎠','Parrilla del mes':'📅','Parrilla semanal':'📆','Copy / Texto':'✍️',
  'Video':'🎦','Guion':'📝','Fotografía':'📸','Sitio web':'🌐','Newsletter':'📧',
  'Pauta / Ads':'📢','Campaña':'🎯','Investigación de mercado':'🔍','Investigación':'🔎',
  'Estrategia':'📊','Propuesta':'💡','Presentación':'📋','Reporte':'📈'
};
const TEAM=[
  {name:'Charly',bg:'#5b8af5',init:'CH'},
  {name:'Dess',  bg:'#a56bff',init:'DE'},
  {name:'Fryda', bg:'#7c5cfc',init:'FR'},
  {name:'Gardenia',bg:'#ff8aab',init:'GA'},
  {name:'Lili',  bg:'#ffab40',init:'LI'},
];
const AVC={Charly:'#5b8af5',Dess:'#a56bff',Fryda:'#7c5cfc',Gardenia:'#ff8aab',Lili:'#ffab40'};
const STL={todo:'POR HACER',proc:'EN PROCESO',review:'POR REVISAR',falta:'FALTA INFO',fin:'FINALIZADA'};
const W_MAX=6; // steps 0–6

// ─── Seed ─────────────────────────────────────────
const SEED_CLIENTS=[
  {id:'auren',name:'Auren',sector:'Industria Privada',color:'#5b8af5'},
  {id:'jaga', name:'JAGA', sector:'Industria Privada',color:'#a56bff'},
  {id:'claa', name:'CLAA', sector:'Gobierno',         color:'#4caf7d'},
];
const D=(off,h,m=0)=>{const d=new Date();d.setDate(d.getDate()+off);d.setHours(h,m,0,0);return d.toISOString()};
const SEED_ACTS=[
  {id:'a1',clientId:'claa', qty:1,tipo:'Parrilla del mes', ctx:'Cambios de última hora antes de publicar',    hace:'Charly',   revisa:'Gardenia',fecha:hoy(),hora:'14:00',urgente:true, status:'todo',  comments:[{from:'Charly',  body:'Todo ok, solo nos falta un cambio',ts:D(0,10,58)}]},
  {id:'a2',clientId:'claa', qty:3,tipo:'Arte estático',     ctx:'Posts campaña de verano · 1080×1080',         hace:'Dess',     revisa:'Fryda',   fecha:hoy(),hora:'17:00',urgente:false,status:'proc',  comments:[{from:'Dess',    body:'Empezando con el primero',         ts:D(0,9,30)}]},
  {id:'a3',clientId:'auren',qty:1,tipo:'Reporte mensual',   ctx:'Métricas y análisis junio 2025',              hace:'Fryda',    revisa:'Charly',  fecha:hoy(),hora:'18:00',urgente:false,status:'review',comments:[{from:'Fryda',   body:'Listo para revisión',              ts:D(-1,17,30)},{from:'Charly',body:'Ya lo tengo',ts:D(-1,17,45)}]},
  {id:'a4',clientId:'auren',qty:2,tipo:'Reel',              ctx:'Producto nuevo línea verano — necesito brief',hace:'Gardenia', revisa:'Lili',    fecha:hoy(),hora:'16:00',urgente:true, status:'falta', comments:[{from:'Gardenia',body:'Necesito el brief completo',         ts:D(0,8,0)}]},
  {id:'a5',clientId:'jaga', qty:1,tipo:'Estrategia Q3',     ctx:'Plan de contenido y pauta Q3',                hace:'Charly',   revisa:'Fryda',   fecha:hoy(),hora:'23:59',urgente:false,status:'fin',   comments:[{from:'Charly',  body:'Aprobado por el cliente ✓',        ts:D(-1,14,0)}]},
  {id:'a6',clientId:'claa', qty:4,tipo:'Historia / Story',  ctx:'Serie educativa sobre el servicio',           hace:'Gardenia', revisa:'Dess',    fecha:hoy(),hora:'15:00',urgente:false,status:'todo',  comments:[]},
];
const SEED_MSGS=[
  {id:'m1', clientId:'claa', type:'text',from:'Gardenia',body:'Buenos días equipo 👋',                               ts:D(-1,9,0)},
  {id:'m2', clientId:'claa', type:'text',from:'Charly',  body:'¡Buen día! Voy con la parrilla',                     ts:D(-1,9,5)},
  {id:'m3', clientId:'claa', type:'card',actId:'a1',                                                                 ts:D(0,10,0)},
  {id:'m4', clientId:'claa', type:'text',from:'Charly',  body:'En proceso, ahorita la mando 💪',                    ts:D(0,10,5)},
  {id:'m5', clientId:'claa', type:'card',actId:'a2',                                                                 ts:D(0,10,10)},
  {id:'m6', clientId:'claa', type:'card',actId:'a6',                                                                 ts:D(0,10,15)},
  {id:'m7', clientId:'auren',type:'text',from:'Fryda',   body:'@Charly el reporte ya está en drive 🙏',             ts:D(-1,17,31)},
  {id:'m8', clientId:'auren',type:'card',actId:'a3',                                                                 ts:D(-1,17,31)},
  {id:'m9', clientId:'auren',type:'card',actId:'a4',                                                                 ts:D(0,8,5)},
  {id:'m10',clientId:'auren',type:'text',from:'Gardenia',body:'@Lili necesito el brief urgente 🔥',                 ts:D(0,8,10)},
  {id:'m11',clientId:'jaga', type:'card',actId:'a5',                                                                 ts:D(-1,14,1)},
  {id:'m12',clientId:'jaga', type:'text',from:'Charly',  body:'El cliente quedó muy contento 🎉',                   ts:D(-1,14,5)},
];
const SEED_NOTIFS=[
  {id:'n1',icon:'📋',text:'Te asignaron: Reporte mensual en Auren',ts:D(-1,17,32),read:false,clientId:'auren',actId:'a3'},
  {id:'n2',icon:'🔥',text:'URGENTE: Reel de Auren espera brief',   ts:D(0,8,11), read:false,clientId:'auren',actId:'a4'},
  {id:'n3',icon:'✅',text:'Estrategia Q3 de JAGA fue aprobada ✓',  ts:D(-1,14,5), read:true, clientId:'jaga', actId:'a5'},
];

// ─── State ───────────────────────────────────────
let {clients,activities,messages}=(()=>{
  try{const s=JSON.parse(localStorage.getItem('adsos-v4')||'{}');if(s.clients&&s.activities&&s.messages)return s;}catch(e){}
  return{clients:SEED_CLIENTS,activities:SEED_ACTS,messages:SEED_MSGS};
})();
let notifications=(()=>{try{const n=JSON.parse(localStorage.getItem('adsos-notifs2')||'null');if(Array.isArray(n))return n;}catch(e){}return SEED_NOTIFS;})();
let activeClientId=null,noteActId=null;

// ─── Notifications ────────────────────────────────
function addNotif(icon,text,clientId,actId){
  notifications.unshift({id:uid(),icon,text,ts:new Date().toISOString(),read:false,clientId,actId});
  notifications=notifications.slice(0,50);updateNotifBadge();persistNotifs();
}
function persistNotifs(){localStorage.setItem('adsos-notifs2',JSON.stringify(notifications));}
function updateNotifBadge(){
  const n=notifications.filter(x=>!x.read).length;
  el('notif-bdg').textContent=n;el('notif-bdg').classList.toggle('hidden',n===0);
}
function toggleNotifPanel(){
  const p=el('notif-panel');
  if(p.classList.contains('hidden')){
    renderNotifList();p.classList.remove('hidden');
    setTimeout(()=>{notifications.forEach(n=>n.read=true);updateNotifBadge();persistNotifs();},1200);
  }else p.classList.add('hidden');
}
function renderNotifList(){
  if(!notifications.length){el('notif-list').innerHTML='<div class="notif-empty">Sin notificaciones</div>';return;}
  el('notif-list').innerHTML=notifications.slice(0,20).map(n=>`
    <div class="notif-item${n.read?'':' unread'}" onclick="clickNotif('${n.id}','${n.clientId||''}')">
      <div class="notif-ic">${n.icon||'📋'}</div>
      <div class="notif-body"><div class="notif-txt">${esc(n.text)}</div><div class="notif-ts">${fmtTs(n.ts)}</div></div>
    </div>`).join('');
}
function clickNotif(id,clientId){el('notif-panel').classList.add('hidden');if(clientId)openClient(clientId);}
function clearNotifs(){notifications=[];renderNotifList();updateNotifBadge();persistNotifs();}

// ─── Sidebar ──────────────────────────────────────
function renderSidebar(){
  const q=(el('sb-q').value||'').toLowerCase();
  const sectors={};
  clients.forEach(c=>{if(q&&!c.name.toLowerCase().includes(q))return;if(!sectors[c.sector])sectors[c.sector]=[];sectors[c.sector].push(c);});
  let html='';
  for(const[sector,list]of Object.entries(sectors)){
    html+=`<div class="sector-lbl">${esc(sector)}</div>`;
    list.forEach(c=>{
      const msgs=messages.filter(m=>m.clientId===c.id),last=msgs[msgs.length-1];
      let prev='';
      if(last){if(last.type==='card'){const a=activities.find(x=>x.id===last.actId);prev=a?`📋 ${a.tipo}`:'📋 Actividad';}else prev=`${last.from}: ${last.body}`;}
      const cnt=activities.filter(a=>a.clientId===c.id&&a.status!=='fin').length;
      html+=`<div class="ch-item${activeClientId===c.id?' active':''}" onclick="openClient('${c.id}')">
        <div class="ch-av" style="background:${c.color}18;color:${c.color}">${initials(c.name)}</div>
        <div class="ch-info"><div class="ch-name">${esc(c.name)}</div><div class="ch-prev">${esc(prev)}</div></div>
        ${cnt?`<span class="ch-bdg">${cnt}</span>`:''}
      </div>`;
    });
  }
  el('sb-body').innerHTML=html||'<div style="padding:20px 14px;color:var(--muted2);font-size:12px">Sin resultados</div>';
}

// ─── Open client ─────────────────────────────────
function openClient(id){
  activeClientId=id;const c=clients.find(x=>x.id===id);
  el('no-chat').style.display='none';
  const cv=el('chat-view');cv.classList.remove('hidden');cv.style.display='flex';
  el('hdr-av').textContent=initials(c.name);
  el('hdr-av').style.cssText=`background:${c.color}18;color:${c.color}`;
  el('hdr-name').textContent=c.name;
  updateHdr();renderSidebar();renderFeed();scrollFeed();
}
function updateHdr(){
  if(!activeClientId)return;
  const acts=activities.filter(a=>a.clientId===activeClientId&&a.status!=='fin');
  const c=clients.find(x=>x.id===activeClientId);
  el('hdr-sub').textContent=acts.length?`${acts.length} actividad${acts.length!==1?'es':''} activa${acts.length!==1?'s':''} · ${c?.sector||''}`:c?.sector||'';
}

// ─── Feed ─────────────────────────────────────────
function cardHtml(actId){
  const a=activities.find(x=>x.id===actId);
  if(!a)return'<div style="padding:12px;color:var(--muted2);font-size:12px">[eliminada]</div>';
  const urg=a.urgente?`<span class="act-urg">🔥 URGENTE</span>`:'';
  const st=`<span class="act-st ${a.status}">${STL[a.status]||a.status}</span>`;
  const lc=a.comments?.length?a.comments[a.comments.length-1]:null;
  const cmt=lc?`<hr class="act-divider"><div class="act-cmt"><div class="act-cmt-dot"></div><div class="act-cmt-txt"><span class="act-cmt-from">${esc(lc.from)}:</span> ${esc(lc.body)}</div></div>`:'';
  let btns='';
  if(a.status==='todo'||a.status==='proc'){btns+=`<button class="act-btn deliver" onclick="advanceAct('${a.id}')">✓ ENTREGAR · A REVISIÓN</button><button class="act-btn nota" onclick="openNote('${a.id}')">+ NOTA</button>`;}
  else if(a.status==='review'){btns+=`<button class="act-btn approve" onclick="finAct('${a.id}')">✓ APROBAR</button><button class="act-btn nota" onclick="openNote('${a.id}')">+ NOTA</button>`;}
  else if(a.status==='falta'){btns+=`<button class="act-btn deliver" onclick="advanceAct('${a.id}')">↗ ENTREGAR DE TODAS FORMAS</button><button class="act-btn nota" onclick="openNote('${a.id}')">+ NOTA</button>`;}
  else if(a.status==='fin'){btns+=`<button class="act-btn reopen" onclick="reopenAct('${a.id}')">↩ Reabrir</button>`;}
  return`<div class="act-card">
    <div class="act-head"><span class="act-qttyp">${esc(a.qty)}× ${esc(a.tipo)}</span>${urg}${st}</div>
    ${a.ctx?`<div class="act-ctx">${esc(a.ctx)}</div>`:''}
    <div class="act-meta">
      ${a.hace?`<div class="act-mi">Hace: <strong>${esc(a.hace)}</strong></div>`:''}
      ${a.revisa?`<div class="act-mi">Revisa: <strong>${esc(a.revisa)}</strong></div>`:''}
      ${a.fecha?`<div class="act-mi">Entrega: <strong>${fmtEntrega(a.fecha,a.hora)}</strong></div>`:''}
    </div>${cmt}
    <div class="act-btns">${btns}</div>
  </div>`;
}
function refreshCard(actId){const w=el('card-'+actId);if(!w)return;const ts=w.querySelector('.act-card-ts');w.innerHTML=cardHtml(actId)+(ts?ts.outerHTML:'');}
function renderFeed(){
  if(!activeClientId)return;
  const msgs=messages.filter(m=>m.clientId===activeClientId),feed=el('feed');
  if(!msgs.length){feed.innerHTML=`<div style="text-align:center;padding:48px 20px;color:var(--muted2);font-size:13px;line-height:1.8">Canal nuevo.<br>Toca <strong style="color:#fff">+ Registrar actividad</strong> para empezar.</div>`;return;}
  let html='',lastD='';
  msgs.forEach(m=>{
    const ds=new Date(m.ts).toDateString();
    if(ds!==lastD){html+=`<div class="date-div"><span>${fmtDateFeed(m.ts)}</span></div>`;lastD=ds;}
    if(m.type==='card'){
      html+=`<div class="act-wrap" id="card-${m.actId}">${cardHtml(m.actId)}<div class="act-card-ts">${fmtTs(m.ts)}</div></div>`;
    }else{
      const me=m.from==='Fryda',ac=AVC[m.from]||'#8a84b8';
      const avStyle=me?'background:var(--accent);color:#fff':`background:${ac}20;color:${ac}`;
      html+=`<div class="msg${me?' me':''}">
        <div class="msg-av" style="${avStyle}">${initials(m.from)}</div>
        <div class="msg-cnt">${!me?`<div class="msg-from">${esc(m.from)}</div>`:''}
          <div class="msg-body">${esc(m.body)}</div><div class="msg-ts">${fmtTs(m.ts)}</div>
        </div></div>`;
    }
  });
  feed.innerHTML=html;
}
function scrollFeed(){setTimeout(()=>{const f=el('feed');if(f)f.scrollTop=f.scrollHeight;},60);}

// ─── Activity actions ─────────────────────────────
function advanceAct(id){
  const a=activities.find(x=>x.id===id);if(!a)return;
  a.status='review';a.comments.push({from:'Sistema',body:'Entregado para revisión',ts:new Date().toISOString()});
  if(a.revisa==='Fryda')addNotif('🔍',`${a.hace} entregó ${a.tipo} — espera tu revisión`,a.clientId,a.id);
  persist();refreshCard(id);renderSidebar();updateHdr();showToast('Enviado a revisión ✓');
}
function finAct(id){
  const a=activities.find(x=>x.id===id);if(!a)return;
  a.status='fin';a.comments.push({from:'Sistema',body:'Actividad aprobada ✓',ts:new Date().toISOString()});
  if(a.hace==='Fryda')addNotif('✅',`Tu ${a.tipo} fue aprobada ✓`,a.clientId,a.id);
  persist();refreshCard(id);renderSidebar();updateHdr();showToast('Actividad aprobada ✓');
}
function reopenAct(id){
  const a=activities.find(x=>x.id===id);if(!a)return;
  a.status='todo';persist();refreshCard(id);renderSidebar();updateHdr();showToast('Actividad reabierta');
}

// ─── Compose ─────────────────────────────────────
function ins(s){const ta=el('compose');ta.value+=s;ta.focus();}
function autoRz(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';}
function onCompKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function sendMsg(){
  const ta=el('compose'),body=ta.value.trim();if(!body||!activeClientId)return;
  messages.push({id:uid(),clientId:activeClientId,type:'text',from:'Fryda',body,ts:new Date().toISOString()});
  ta.value='';ta.style.height='auto';persist();renderFeed();scrollFeed();renderSidebar();
}

// ─── Voice ────────────────────────────────────────
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let srInst=null,srActive=false,srTarget=null;
function startSR(targetId){
  if(!SR){showToast('Dictado no disponible en este navegador','err');return;}
  if(srActive&&srTarget===targetId){stopSR();return;}
  if(srActive)srInst.stop();
  srTarget=targetId;
  srInst=new SR();srInst.lang='es-MX';srInst.interimResults=true;srInst.continuous=true;
  srInst.onresult=e=>{const t=Array.from(e.results).map(r=>r[0].transcript).join('');const ta=el(srTarget);if(ta)ta.value=t;};
  srInst.onerror=()=>{srActive=false;updateMicUI();};
  srInst.onend=()=>{srActive=false;updateMicUI();};
  srInst.start();srActive=true;updateMicUI();
}
function stopSR(){if(srInst&&srActive)srInst.stop();}
function updateMicUI(){
  // compose mic
  const cm=el('compose-mic');if(cm){const on=srActive&&srTarget==='compose';cm.textContent=on?'⏹':'🎙';cm.classList.toggle('active',on);}
  // wizard inline mics (by ID convention mic-<targetId>)
  ['wz-obj','wz-ctx','wz-res'].forEach(tid=>{
    const btn=el('mic-'+tid);if(!btn)return;const on=srActive&&srTarget===tid;btn.textContent=on?'⏹':'🎙';btn.classList.toggle('active',on);
  });
  // big mic
  const bm=el('wz-big-mic');
  if(bm){const on=srActive&&srTarget==='wz-ctx';bm.classList.toggle('active',on);bm.textContent=on?'⏹':'🎙';}
  const vl=el('wz-voice-lbl');
  if(vl){const on=srActive&&(srTarget==='wz-obj'||srTarget==='wz-ctx'||srTarget==='wz-res');vl.textContent=on?'Escuchando… habla ahora':'Toca para dictar';vl.classList.toggle('on',on);}
}

// ══════════════════════════════════
//  WIZARD
// ══════════════════════════════════
let wStep=0;
let wData={tipo:'',qty:1,objetivo:'',ctx:'',fecha:'',hora:'17:00',hace:'',revisa:'',resultado:'',quien_dudas:'',material:'',urgente:false};

function openWizard(){
  if(!activeClientId)return;
  wStep=0;
  wData={tipo:'',qty:1,objetivo:'',ctx:'',fecha:hoy(),hora:'17:00',hace:'',revisa:'',resultado:'',quien_dudas:'',material:'',urgente:false};
  el('feed').style.display='none';
  el('compose-bar').style.display='none';
  el('wizard').classList.remove('hidden');
  wRender();
}
function closeWizard(){
  stopSR();
  el('wizard').classList.add('hidden');
  el('feed').style.display='';
  el('compose-bar').style.display='';
}
function wRender(){
  const pct=Math.round(((wStep+1)/(W_MAX+1))*100);
  el('wz-prog').style.width=pct+'%';
  el('wz-step-lbl').textContent=`PASO ${wStep+1} DE ${W_MAX+1}`;
  el('wz-back').style.visibility=wStep===0?'hidden':'visible';
  el('wz-next').textContent=wStep===W_MAX?'REGISTRAR EN EL CANAL →':'Continuar →';
  el('wz-scroll').scrollTop=0;
  const builds=[ws0,ws1,ws2,ws3,ws4,ws5,ws6];
  builds[wStep]();
}
function wSave(){
  if(wStep===2){if(el('wz-obj'))wData.objetivo=el('wz-obj').value.trim();if(el('wz-ctx'))wData.ctx=el('wz-ctx').value.trim();}
  if(wStep===3){if(el('wz-fecha'))wData.fecha=el('wz-fecha').value;if(el('wz-hora'))wData.hora=el('wz-hora').value;}
  if(wStep===5){if(el('wz-res'))wData.resultado=el('wz-res').value.trim();if(el('wz-mat'))wData.material=el('wz-mat').value.trim();}
}
function wValidate(){
  if(wStep===0&&!wData.tipo){showToast('Elige el tipo de actividad','err');return false;}
  if(wStep===3&&!wData.fecha){showToast('Selecciona una fecha','err');return false;}
  return true;
}
function wNext(){wSave();if(!wValidate())return;if(wStep===W_MAX){submitWizard();return;}wStep++;wRender();}
function wBack(){wSave();if(wStep>0){wStep--;wRender();}}

// ── Step builders ─────────────────────────────────

function teamChips(who,sm){
  return TEAM.map(tm=>{
    const sel=wData[who]===tm.name?' sel':'';
    return`<button class="wz-team-btn${sel}${sm?' wz-team-sm':''}" data-who="${who}" data-name="${esc(tm.name)}" onclick="wSelTeam(this)">
      <div class="wz-team-av" style="background:${tm.bg}20;color:${tm.bg}">${tm.init}</div>
      <span class="wz-team-nm">${esc(tm.name)}</span>
    </button>`;
  }).join('');
}
function dateScs(){
  const now=new Date();
  return[0,1,2,3,4,5].map(i=>{
    const d=new Date(now);d.setDate(now.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const lbl=i===0?'Hoy':i===1?'Mañana':d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric'});
    return`<button class="wz-dsc${wData.fecha===ds?' sel':''}" onclick="wSetDate('${ds}',this)">${esc(lbl)}</button>`;
  }).join('');
}

// Step 0: ¿Qué tipo?
function ws0(){
  let chips='';
  for(const[cat,tipos]of Object.entries(TIPOS)){
    tipos.forEach(t=>{
      const ic=TIPO_IC[t]||'📋',sel=wData.tipo===t?' sel':'';
      chips+=`<button class="wz-tipo-btn${sel}" data-cat="${esc(cat)}" data-val="${esc(t)}" onclick="wSelTipo(this)">
        <span class="wz-tipo-ic">${ic}</span>
        <span class="wz-tipo-lbl">${esc(t)}</span>
      </button>`;
    });
  }
  const catBtns=['Todas',...Object.keys(TIPOS)].map((c,i)=>`<button class="wz-cat${i===0?' sel':''}" onclick="wFilterCat('${esc(c)}',this)">${esc(c)}</button>`).join('');
  el('wz-content').innerHTML=`
    <div class="wz-q">¿Qué tipo de actividad<br>necesitas registrar?</div>
    <div class="wz-hint">Toca para seleccionar · Solo se muestra una vez en el canal</div>
    <div class="wz-cats">${catBtns}</div>
    <div class="wz-tipo-grid" id="wz-tipo-grid">${chips}</div>
    ${wData.tipo?`<div class="wz-selected-tipo"><span class="check">✓</span>${TIPO_IC[wData.tipo]||'📋'} ${esc(wData.tipo)} seleccionado</div>`:''}`;
}

// Step 1: Cantidad
function ws1(){
  el('wz-content').innerHTML=`
    <div class="wz-q">¿Cuántas piezas?</div>
    <div class="wz-hint">${TIPO_IC[wData.tipo]||'📋'} ${esc(wData.tipo)}</div>
    <div class="wz-qty-center">
      <div class="wz-qty-row">
        <button class="wz-qbtn" onclick="wChgQty(-5)">−5</button>
        <button class="wz-qbtn" onclick="wChgQty(-1)">−</button>
        <span class="wz-qnum" id="wz-qnum">${wData.qty}</span>
        <button class="wz-qbtn" onclick="wChgQty(1)">+</button>
        <button class="wz-qbtn" onclick="wChgQty(5)">+5</button>
      </div>
      <div class="wz-qsub" id="wz-qsub">${wData.qty}× ${esc(wData.tipo)}</div>
    </div>`;
}

// Step 2: Objetivo + contexto + voz
function ws2(){
  el('wz-content').innerHTML=`
    <div class="wz-q">¿Cuál es el objetivo?</div>
    <div class="wz-hint">Una línea que resume qué busca lograr esta actividad</div>
    <div class="wz-inp-wrap">
      <input id="wz-obj" class="wz-inp" placeholder="Ej: Promover el lanzamiento del producto X…" autocomplete="off">
      <button class="wz-mic-inline" id="mic-wz-obj" onclick="startSR('wz-obj')" title="Dictar">🎙</button>
    </div>

    <div class="wz-q2">¿Qué necesita exactamente?</div>
    <div class="wz-hint2">Detalles, referencias, restricciones — escribe o habla</div>
    <textarea id="wz-ctx" class="wz-ta" placeholder="Describe lo que necesitas, contexto del cliente, material de referencia…"></textarea>
    <div class="wz-voice-area">
      <button class="wz-big-mic" id="wz-big-mic" onclick="startSR('wz-ctx')" title="Dictar contexto">🎙</button>
      <span class="wz-voice-lbl" id="wz-voice-lbl">Toca para dictar</span>
    </div>`;
  el('wz-obj').value=wData.objetivo;
  el('wz-ctx').value=wData.ctx;
  updateMicUI();
}

// Step 3: ¿Para cuándo?
function ws3(){
  el('wz-content').innerHTML=`
    <div class="wz-q">¿Para cuándo?</div>
    <div class="wz-hint">Elige un acceso rápido o una fecha exacta</div>
    <div class="wz-date-scs">${dateScs()}</div>
    <div class="wz-date-row">
      <div>
        <div class="wz-flbl">Fecha</div>
        <input id="wz-fecha" type="date" class="wz-inp-d" value="${wData.fecha}">
      </div>
      <div>
        <div class="wz-flbl">Hora límite</div>
        <input id="wz-hora" type="time" class="wz-inp-d" value="${wData.hora||'17:00'}">
      </div>
    </div>`;
  el('wz-fecha').addEventListener('change',e=>{wData.fecha=e.target.value;document.querySelectorAll('.wz-dsc').forEach(b=>b.classList.remove('sel'));});
}

// Step 4: Quién hace / revisa
function ws4(){
  el('wz-content').innerHTML=`
    <div class="wz-q">¿Quién lo hace?</div>
    <div class="wz-hint">Responsable de crear la actividad</div>
    <div class="wz-team-grid">${teamChips('hace',false)}</div>

    <div class="wz-q2">¿Quién lo revisa?</div>
    <div class="wz-hint2">Responsable de aprobar y dar feedback</div>
    <div class="wz-team-grid">${teamChips('revisa',false)}</div>`;
}

// Step 5: Resultado + dudas + material
function ws5(){
  el('wz-content').innerHTML=`
    <div class="wz-q">¿Qué resultado se espera?</div>
    <div class="wz-hint">¿Cómo sabremos que está lista? Formato, resolución, criterio de entrega</div>
    <div class="wz-inp-wrap">
      <input id="wz-res" class="wz-inp" placeholder="Ej: PNG aprobado 1080×1080, subido a Drive…" autocomplete="off">
      <button class="wz-mic-inline" id="mic-wz-res" onclick="startSR('wz-res')" title="Dictar">🎙</button>
    </div>

    <div class="wz-q2">¿Quién puede resolver dudas?</div>
    <div class="wz-hint2">Opcional — a quién preguntar si hay bloqueos</div>
    <div class="wz-team-grid">${teamChips('quien_dudas',true)}</div>

    <div class="wz-q2">Material de apoyo</div>
    <div class="wz-hint2">Opcional — brief, Google Drive, referencia</div>
    <input id="wz-mat" class="wz-inp" type="url" placeholder="https://drive.google.com/…" style="margin-top:0">`;
  el('wz-res').value=wData.resultado;
  el('wz-mat').value=wData.material;
  updateMicUI();
}

// Step 6: Confirmación
function ws6(){
  const c=clients.find(x=>x.id===activeClientId);
  const rows=[
    ['Qué',`${wData.qty}× ${wData.tipo}`],
    ['Cliente',c?.name||'—'],
    ...(wData.objetivo?[['Objetivo',wData.objetivo]]:[]),
    ...(wData.ctx?[['Contexto',wData.ctx]]:[]),
    ['Entrega',fmtEntrega(wData.fecha,wData.hora)],
    ...(wData.hace?[['Hace',wData.hace]]:[]),
    ...(wData.revisa?[['Revisa',wData.revisa]]:[]),
    ...(wData.resultado?[['Resultado',wData.resultado]]:[]),
    ...(wData.quien_dudas?[['Dudas',wData.quien_dudas]]:[]),
    ...(wData.material?[['Material',wData.material]]:[]),
  ];
  el('wz-content').innerHTML=`
    <div class="wz-q">Listo para registrar</div>
    <div class="wz-hint">Aparecerá en el canal de ${esc(c?.name||'')} como una tarjeta de actividad</div>
    <div class="wz-summary">${rows.map(([k,v])=>`
      <div class="wz-sum-row">
        <span class="wz-sum-lbl">${esc(k)}</span>
        <span class="wz-sum-val">${esc(v)}</span>
      </div>`).join('')}</div>
    <div class="wz-urg${wData.urgente?' on':''}" id="wz-urg-toggle" onclick="wToggleUrg()">
      <span class="wz-urg-ic">🔥</span>
      <div class="wz-urg-inf">
        <div class="wz-urg-t">Urgente</div>
        <div class="wz-urg-d">Todo el equipo recibirá una notificación especial</div>
      </div>
      <div class="wz-urg-sw"></div>
    </div>`;
}

// ── Wizard interactions ───────────────────────────
function wSelTipo(btn){
  document.querySelectorAll('.wz-tipo-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');wData.tipo=btn.dataset.val;
  // update selected display
  let sd=document.querySelector('.wz-selected-tipo');
  if(!sd){sd=document.createElement('div');sd.className='wz-selected-tipo';el('wz-content').appendChild(sd);}
  sd.innerHTML=`<span class="check">✓</span>${TIPO_IC[wData.tipo]||'📋'} ${esc(wData.tipo)} seleccionado`;
}
function wFilterCat(cat,btn){
  document.querySelectorAll('.wz-cat').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.querySelectorAll('.wz-tipo-btn').forEach(b=>{b.style.display=(cat==='Todas'||b.dataset.cat===cat)?'':'none';});
}
function wChgQty(d){
  wData.qty=Math.max(1,Math.min(99,wData.qty+d));
  const n=el('wz-qnum'),s=el('wz-qsub');
  if(n)n.textContent=wData.qty;if(s)s.textContent=`${wData.qty}× ${wData.tipo}`;
}
function wSelTeam(btn){
  const who=btn.dataset.who,name=btn.dataset.name;
  wData[who]=wData[who]===name?'':name;
  document.querySelectorAll(`.wz-team-btn[data-who="${who}"]`).forEach(b=>b.classList.toggle('sel',b.dataset.name===wData[who]));
}
function wSetDate(ds,btn){
  wData.fecha=ds;const fi=el('wz-fecha');if(fi)fi.value=ds;
  document.querySelectorAll('.wz-dsc').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');
}
function wToggleUrg(){
  wData.urgente=!wData.urgente;
  const t=el('wz-urg-toggle');if(t)t.classList.toggle('on',wData.urgente);
}

// ── Submit ────────────────────────────────────────
function submitWizard(){
  const c=clients.find(x=>x.id===activeClientId);
  const act={
    id:uid(),clientId:activeClientId,
    qty:wData.qty,tipo:wData.tipo,ctx:wData.ctx,
    hace:wData.hace,revisa:wData.revisa,
    fecha:wData.fecha,hora:wData.hora,urgente:wData.urgente,
    status:'todo',comments:[]
  };
  // store extra metadata in comments as first entry
  if(wData.objetivo||wData.resultado||wData.quien_dudas||wData.material){
    let extra='';
    if(wData.objetivo)extra+=`Objetivo: ${wData.objetivo}\n`;
    if(wData.resultado)extra+=`Resultado esperado: ${wData.resultado}\n`;
    if(wData.quien_dudas)extra+=`Dudas con: ${wData.quien_dudas}\n`;
    if(wData.material)extra+=`Material: ${wData.material}`;
    if(extra.trim())act.comments.push({from:'Sistema',body:extra.trim(),ts:new Date().toISOString()});
  }
  activities.push(act);
  messages.push({id:uid(),clientId:activeClientId,type:'card',actId:act.id,ts:new Date().toISOString()});
  if(wData.hace==='Fryda')addNotif('📋',`Te asignaron: ${wData.qty}× ${wData.tipo} en ${c?.name}`,activeClientId,act.id);
  if(wData.revisa==='Fryda'&&wData.revisa!==wData.hace)addNotif('🔍',`Debes revisar: ${wData.tipo} en ${c?.name}`,activeClientId,act.id);
  if(wData.urgente)addNotif('🔥',`🔥 URGENTE: ${wData.qty}× ${wData.tipo} registrado en ${c?.name}`,activeClientId,act.id);
  persist();closeWizard();renderFeed();scrollFeed();renderSidebar();updateHdr();stopSR();
  showToast('Actividad registrada en el canal ✓');
}

// ─── Note modal ───────────────────────────────────
function openNote(actId){noteActId=actId;el('note-ta').value='';el('note-modal').classList.remove('hidden');setTimeout(()=>el('note-ta').focus(),60);}
function closeNote(){el('note-modal').classList.add('hidden');noteActId=null;}
function submitNote(){
  const body=el('note-ta').value.trim();if(!body)return;
  const a=activities.find(x=>x.id===noteActId);if(!a)return;
  a.comments.push({from:'Fryda',body,ts:new Date().toISOString()});
  persist();closeNote();refreshCard(noteActId);showToast('Nota agregada');
}

// ─── Event listeners ──────────────────────────────
el('note-modal').addEventListener('click',e=>{if(e.target===el('note-modal'))closeNote();});
document.addEventListener('click',e=>{if(!el('notif-wrap').contains(e.target))el('notif-panel').classList.add('hidden');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNote();el('notif-panel').classList.add('hidden');}});

// ─── Init ─────────────────────────────────────────
updateNotifBadge();
renderSidebar();
if(clients.length)openClient(clients[0].id);
</script>
